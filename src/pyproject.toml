[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echartsify"
version = "0.1.0"
description = "Generate ECharts option by Python."
readme = "README.md"
authors = [{ name = "Anna Hsu", email = "hsuyx96@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pandas",
]

[project.urls]
Homepage = "https://github.com/TsrmKumoko/echartsify"
